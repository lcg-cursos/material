# De los issues al seguimiento del proyecto

Cada equipo ya tiene:

- Actividades identificadas.
- Issues con resultados esperados.
- Criterios de aceptación.
- Personas responsables.
- Etiquetas para clasificar el trabajo.

Ahora necesitamos observar el trabajo como un conjunto:

- ¿Qué está pendiente?  
- ¿Qué se está realizando?  
- ¿Qué necesita revisión?  
- ¿Qué ya fue terminado?

Para responder a estas preguntas utilizaremos **GitHub Projects**.

???

Esta diapositiva enlaza directamente con el ejercicio anterior. Los estudiantes
no crearán actividades nuevas: organizarán los issues que ya redactaron.

# Gestión del trabajo con GitHub Projects

## Objetivo

Al finalizar, cada equipo contará con un espacio compartido para:

- Reunir los issues de su proyecto.
- Visualizar el estado del trabajo.
- Priorizar actividades.
- Consultar responsabilidades.
- Identificar avances y bloqueos.
- Dar seguimiento a la tarea del equipo.

&lt;img src="img/board.png" width="420px" style="display: block; margin: auto;" /&gt;

---
## Issue y Project no son lo mismo

| Issue | GitHub Project |
|:--|:--|
| Describe una actividad | Reúne las actividades |
| Explica qué debe realizarse | Muestra el avance general |
| Tiene responsable y criterios | Permite comparar prioridades y estados |
| Conserva comentarios y decisiones | Ofrece diferentes vistas del trabajo |
| Se abre y se cierra | Evoluciona durante todo el proyecto |
  
  

&gt; Los issues son las unidades de trabajo; el Project es la vista que permite coordinarlas/ordenarlas.

---
## ¿Qué es GitHub Projects?

Es una herramienta de planificación y seguimiento que integra:

- Issues.
- Pull Requests.
- Responsables.
- Etiquetas.
- Estados.
- Prioridades.
- Fechas y otros campos personalizados.

&lt;img src="img/projects_board.png" width="760px" style="display: block; margin: auto;" /&gt;

---
## El tablero representa el estado del trabajo

| Estado | Significado |
|:--|:--|
| **Backlog** | Actividad identificada que se pretende realizar - IDEAS |
| **Por hacer** | Actividad seleccionada para realizarse |
| **En progreso** | Una persona está trabajando en ella |
| **En revisión** | El resultado necesita ser comprobado |
| **Terminado** | Cumple los criterios y fue incorporado al repositorio |

Cada issue se mueve conforme avanza el trabajo:

.center[
### Por hacer → En progreso → En revisión → Terminado
]

&gt; El estado debe reflejar la situación real de la actividad.

&lt;img src="img/tablero-kanban.png" width="450px" style="display: block; margin: auto;" /&gt;

---

## EJERCICIO EN CLASE

# Crear el Project del equipo

**Tiempo total: 14 minutos**

### Paso 1. Crear el Project — 3 minutos

La persona propietaria del repositorio:

1. Abre su perfil en GitHub.
2. Ingresa a **Projects**.
3. Selecciona **New project**.
4. Elige la plantilla **Board**.
5. Asigna un nombre descriptivo.
6. Habilita **Import items from repository** selecciona el repositorio del equipo
7. **Create project**

&gt; Sólo una persona crea el Project.


---
## EJERCICIO — Acceso y vinculación

### Paso 2. Agregar al equipo — 3 minutos

La persona administradora:

1. Abre el menú del Project (opción ... en la esquina superior derecha).
2. Ingresa a **Settings**.
3. Selecciona **Manage access**.
4. Invita a las otras dos personas de tu equipo.
5. Otorga permiso de escritura - Role: Write.


### Comprobación

Las tres personas deben poder abrir y editar el Project.

---

## EJERCICIO — Configurar el flujo

### Paso 3. Revisar los estados — 4 minutos

Configuren el tablero con los carriles (estados):

&gt; Usa la opción **+**, "add a new column to the board".  

```text
Backlog
Por hacer
En progreso
En revisión
Terminado
```


Después:

1. Coloquen los issues previamente creados en **Por hacer**.
2. Mantengan en **Backlog** las actividades futuras (opcional por ahora).
3. Verifiquen que cada integrante tenga trabajo asignado.
4. Identifiquen si alguna actividad depende de otra.

&gt; Al comenzar una actividad, su responsable deberá moverla a “En progreso”.

---

## Comprobación del ejercicio

Antes de finalizar, el equipo debe tener:

- [ ] Un solo Project compartido.
- [ ] Repositorio y Project vinculados.
- [ ] Acceso para las tres personas.
- [ ] Al menos seis issues incorporados.
- [ ] Cinco estados configurados.
- [ ] Issues de la tarea en “Por hacer”.
- [ ] Al menos una actividad asignada a cada integrante.

### Pregunta para cada integrante

&gt; ¿Qué issue atenderé y cómo cambiará su estado durante la tarea?

---

## Durante la tarea

Cada integrante deberá actualizar el Project:

| Cuando ocurra esto... | Cambien el estado a... |
|:--|:--|
| La actividad fue seleccionada | Por hacer |
| Comenzaron a trabajar | En progreso |
| El resultado está listo para comprobarse | En revisión |
| Cumple los criterios y se integró | Terminado |
| Todavía no se realizará | Backlog |

También deben utilizar los comentarios del issue para registrar:

- Dudas.
- Decisiones.
- Inconvenientes.
- Avances relevantes.

&gt; El tablero debe mostrar el estado real del equipo, no actualizarse únicamente antes de la entrega.

---
## Conclusiones

GitHub Projects permite transformar una lista de issues en una visión compartida del trabajo.

Por medio del Project, el equipo puede:

- Visualizar las actividades pendientes.
- Priorizar el trabajo.
- Consultar responsables.
- Identificar tareas en progreso o con pendientes.
- Saber qué necesita revisión.
- Dar seguimiento al avance general.

.center[
### Los issues explican qué debe hacerse.  
### GitHub Projects muestra cómo avanza el equipo.
]
