# Versionamiento en Git usando tags

## Objetivo

Al finalizar la actividad podremos:

- Identificar estados importantes de un proyecto mediante **etiquetas o tags**.
- Crear y consultar etiquetas en Git.
- Publicarlas en GitHub.
- Obtener las etiquetas creadas por otros integrantes del equipo.

---

## ¿Qué es una etiqueta?

Durante el desarrollo de un proyecto realizamos muchos cambios:

```text
●──●──●──●──●──●
```

Cada punto representa un **commit**.

En algún momento podemos considerar que uno de esos estados es importante:

```text
                   v0.1.0
                      ↓
●──●──●──●──●───────●
```

.full-width[.content-box-blue[
Una **etiqueta (`tag`)** es un nombre que asignamos a un commit específico para identificar un estado importante del proyecto.
]]

---

## ¿Para qué sirven las etiquetas?

Las etiquetas permiten:

- Identificar **versiones** del proyecto.
- Marcar estados importantes o estables.
- Saber exactamente qué commit corresponde a una versión.
- Recuperar o revisar un estado anterior del proyecto.
- Compartir con los colaboradores qué versión se considera importante.

.full-width[.content-box-yellow[
Un tag hace referencia al **estado del repositorio completo**, no a la versión de un solo archivo.
]]

---

## Ejemplo

Podemos usar etiquetas como:

```text
v0.1.0 → Primera definición del proyecto
v0.2.0 → Incorporación del análisis de datos
v1.0.0 → Primera versión completa
```

.full-width[.content-box-blue[
Las etiquetas permiten identificar puntos específicos e importantes en la historia de un proyecto.
]]

---

## Ramas vs. etiquetas

.pull-left[

### Rama

Una rama representa una **línea de trabajo que continúa cambiando**.

```text
              docs/12-info-general
                 ↓
main ●──●──●
          \
           ●──●──●
```

]

.pull-right[

### Tag

Un tag identifica un **commit concreto**.

```text
                v0.1.0
                 ↓
main ●──●──●──●──●
```

]

---

## Ramas vs. etiquetas

.full-width[.content-box-yellow[
**Las ramas se mueven conforme hacemos commits.**

**Las etiquetas permanecen asociadas al mismo commit.**
]]

---

## ¿Dónde entran las etiquetas en nuestro flujo de trabajo?

```text
Issue
  ↓
Crear rama
  ↓
Trabajar
  ↓
Commit
  ↓
Push
  ↓
Pull Request
  ↓
Merge
  ↓
main
  ↓
Tag
```

---

## Ejemplo aplicado al proyecto

Supongamos que varios integrantes trabajaron en:

```text
docs/10-planteamiento
docs/11-objetivos
docs/12-info-general
```

Después de revisar sus Pull Requests, el trabajo quedó integrado en:

```text
main
```

Si consideramos que ese estado representa la **primera versión del reporte del proyecto**, podemos marcarlo como:

```text
v0.1.0
```

---

## Numeración de versiones

Una forma común de nombrar versiones es:

```text
vX.Y.Z
```

Por ejemplo:

```text
v1.2.3
```

- **X** → cambios mayores.
- **Y** → nuevas funcionalidades.
- **Z** → correcciones o ajustes.

Para nuestro proyecto podemos comenzar con:

```text
v0.1.0
```

---

## Antes de crear una etiqueta

Queremos etiquetar una versión que ya fue integrada en `main`.

Primero:

```bash
git switch main
```

Después actualizamos:

```bash
git pull
```

Y comprobamos:

```bash
git status
```

---

## Antes de crear una etiqueta

Esperamos algo semejante a:

```text
On branch main
Your branch is up to date with 'origin/main'.

nothing to commit, working tree clean
```

.full-width[.content-box-yellow[
Debemos asegurarnos de que estamos etiquetando **el estado correcto del proyecto**.
]]

---

## Crear una etiqueta

Crearemos:

```text
v0.1.0
```

Utilizamos:

```bash
git tag -a v0.1.0 -m "Primera versión de la definición del proyecto"
```

---

## Crear una etiqueta

¿Qué significa?

```text
git tag
```

Trabaja con etiquetas.

```text
-a v0.1.0
```

Crea una etiqueta anotada llamada `v0.1.0`.

```text
-m "..."
```

Agrega un mensaje descriptivo.

---

## Consultar etiquetas

Para saber qué etiquetas existen en nuestro repositorio local:

```bash
git tag
```

Por ejemplo:

```text
v0.1.0
v0.2.0
```

---

## Revisar una etiqueta específica

Para revisar la información asociada a una etiqueta:

```bash
git show v0.1.0
```

Esto permite consultar información sobre el commit asociado a esa versión.

---

## Local ≠ remoto

Cuando hacemos:

```bash
git tag -a v0.1.0 -m "Primera versión"
```

la etiqueta existe inicialmente **solo en nuestro repositorio local**.

```text
Computadora                   GitHub

v0.1.0                         ?
```

---

## Publicar una etiqueta

Para publicar una etiqueta específica:

```bash
git push origin v0.1.0
```

Después:

```text
Computadora                   GitHub

v0.1.0 ────────────────────→ v0.1.0
```

.full-width[.content-box-yellow[
Crear una etiqueta localmente **no** significa que ya se encuentre publicada en GitHub.
]]

---

## ¿Y el resto del equipo?

Supongamos que un integrante creó y publicó:

```text
v0.1.0
```

Otro integrante puede obtener las etiquetas remotas mediante:

```bash
git fetch --tags
```

Después puede comprobarlas con:

```bash
git tag
```

---

## Flujo colaborativo

```text
Integrante A
      │
 crea v0.1.0
      │
      ▼
git push origin v0.1.0
      │
      ▼
    GitHub
      │
      ▼
git fetch --tags
      │
      ▼
Integrante B
```

---

## Comandos básicos para trabajar con tags

```bash
# Crear una etiqueta
git tag -a v0.1.0 -m "Primera versión"

# Consultar etiquetas locales
git tag

# Revisar una etiqueta
git show v0.1.0

# Publicar una etiqueta
git push origin v0.1.0

# Obtener etiquetas remotas
git fetch --tags
```

---

## Práctica: primera versión del proyecto

### Situación

El equipo ha terminado una primera etapa del proyecto.

Los cambios fueron:

- trabajados en ramas;
- publicados mediante `push`;
- revisados mediante Pull Requests;
- integrados en `main`.

Ahora queremos identificar ese estado como:

```text
v0.1.0
```

---

## Práctica: preparar `main`

### Paso 1. Ir a `main`

```bash
git switch main
```

### Paso 2. Actualizar

```bash
git pull
```

### Paso 3. Revisar el estado

```bash
git status
```

---

## Práctica: crear y publicar la etiqueta

Un integrante del equipo ejecutará:

```bash
git tag -a v0.1.0 -m "Primera versión de la definición del proyecto"
```

Comprueba:

```bash
git tag
```

Después publica:

```bash
git push origin v0.1.0
```

Finalmente, verifica en GitHub que exista:

```text
v0.1.0
```

---

## Práctica colaborativa

Ahora otro integrante del equipo obtendrá la etiqueta.

Primero:

```bash
git fetch --tags
```

Después:

```bash
git tag
```

Debe aparecer:

```text
v0.1.0
```

Puede revisar la información:

```bash
git show v0.1.0
```

---

## Pregunta al grupo

.full-width[.content-box-blue[
**¿Por qué el segundo integrante no tuvo que crear nuevamente `v0.1.0`?**
]]

Respuesta esperada:

&gt; Porque la etiqueta ya había sido creada y publicada en el repositorio compartido.

---

## ¿Qué debemos recordar?

| Concepto | Función |
|---|---|
| **Issue** | Define una tarea |
| **Rama** | Permite trabajar de manera independiente |
| **Commit** | Registra un cambio |
| **Push** | Publica avances |
| **Pull Request** | Solicita integrar cambios |
| **Merge** | Integra el trabajo a `main` |
| **Tag** | Identifica un estado o versión |

---

## Conclusión

.full-width[.content-box-yellow[
**Las etiquetas nos ayudan a identificar versiones importantes de ese proyecto.**
]]

### Comandos clave

```bash
git tag -a v0.1.0 -m "Primera versión"
git tag
git show v0.1.0
git push origin v0.1.0
git fetch --tags
```
