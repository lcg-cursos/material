# En la clase anterior

Organizamos el trabajo mediante **issues**.

Como parte de la tarea, cada equipo comenzó a elaborar:

- `README.md`.
- `docs/reporte-proyecto.md`.

Varias personas pudieron modificar simultáneamente los mismos archivos.

### ¿Cómo integraron sus aportaciones?

???

Recupera la experiencia antes de explicar las ramas. Pide dos o tres respuestas
breves. Evita presentar los problemas como errores personales: fueron una
consecuencia natural de colaborar directamente sobre la misma rama.

Tiempo estimado: 1 minuto.

---
## ¿Qué ocurrió durante la tarea?

- ¿Dos personas editaron simultáneamente el mismo archivo?
- ¿Algún `push` fue rechazado porque había cambios nuevos?
- ¿Tuvieron que ejecutar `pull` antes de poder enviar?
- ¿Apareció algún conflicto?
- ¿Fue sencillo identificar qué sección modificó cada persona?
- ¿Pudieron revisar los cambios antes de incorporarlos?

&gt; Los issues organizaron las actividades, pero no separaron los cambios realizados en los archivos.

???

No es necesario resolver cada caso en este momento. Registra verbalmente los
problemas que mencionen y úsalos como punto de partida para la comparación
siguiente.

Tiempo estimado: 2 minutos.

---
## En la tarea trabajamos directamente en `main`

Cada integrante realizó un flujo semejante:

.center[
### Issue → modificar archivos → commit → push a `main`
]

Este flujo puede funcionar cuando:

- Trabaja una sola persona en el repositorio.
- Los cambios se realizan uno después de otro.
- Todos actualizan el repositorio antes de editar.
- Nadie modifica simultáneamente las mismas líneas.

Cuando varias personas trabajan al mismo tiempo, `main` puede cambiar mientras
alguien todavía prepara su contribución.

???

Aclara que trabajar directamente en main no es siempre incorrecto. El problema
es que resulta frágil cuando varias personas colaboran simultáneamente.

Tiempo estimado: 1 minuto.

---
## Trabajar directamente en `main` o utilizar ramas

| Directamente en `main` | Mediante una rama |
|:--|:--|
| El cambio llega inmediatamente a la rama principal | El cambio permanece separado mientras se prepara |
| Todos envían cambios al mismo destino | Cada actividad tiene su propia rama |
| Un cambio incompleto puede afectar al equipo | `main` conserva la versión integrada |
| La revisión ocurre después de enviar | El Pull Request permite revisar antes de integrar |
| Los problemas aparecen durante `pull` o `push` | Los cambios se comparan antes de fusionarse |

&gt; Las ramas no eliminan los conflictos, pero permiten detectarlos y atenderlos antes de incorporar los cambios en `main`.

???

Ésta es la comparación central de la lección. No prometas que las ramas evitan
todos los conflictos: si dos personas modifican las mismas líneas, Git todavía
puede solicitar una decisión.

Tiempo estimado: 2 minutos.

# Trabajar con ramas en Git

## Objetivo

Al finalizar, podrán:

- Explicar para qué se utiliza una rama.
- Diferenciar `main` de una rama de trabajo.
- Crear y publicar una rama mediante terminal o GitHub Desktop.
- Modificar simultáneamente distintas secciones de un mismo archivo.
- Proponer, revisar e integrar cambios mediante un Pull Request.

&lt;img src="img/branches.png" width="430px" style="display: block; margin: auto;" /&gt;

???

La meta no es memorizar todos los comandos. La meta es comprender y realizar
una vez el flujo completo con un cambio pequeño y controlado.

Tiempo estimado: 1 minuto.

---
## `main` y las ramas de trabajo

| `main` | Rama de trabajo |
|:--|:--|
| Contiene la versión integrada | Contiene un cambio en preparación |
| Es compartida por el equipo | Atiende una actividad concreta |
| Debe conservarse estable | Puede avanzar sin alterar `main` |
| Recibe cambios revisados | Se propone mediante un Pull Request |

&gt; Una rama es un espacio temporal para trabajar en una actividad sin modificar directamente la versión principal.

&lt;img src="img/branchesOctopus.jpeg" width="450px" style="display: block; margin: auto;" /&gt;

???

Evita explicar punteros o detalles internos de Git. La rama parte del mismo
contenido de main y comienza a diferenciarse cuando recibe nuevos commits.

Tiempo estimado: 1 minuto.

---
## Tres personas pueden editar el mismo archivo

Los tres integrantes partirán del mismo archivo:

```text
docs/reporte-proyecto.md
```

Cada persona trabajará en una sección diferente:

| Integrante | Sección | Nombre de la rama de ejemplo |
|:--|:--|:--|
| Persona 1 | Resumen del proyecto | `docs/1-resumen` |
| Persona 2 | Contexto y antecedentes | `docs/2-contexto-antecedentes` |
| Persona 3 | Justificación | `docs/3-justificacion` |

&gt; Las ramas contienen el documento completo, pero cada persona realizará un cambio distinto.

???

Ésta es la idea central. No se requiere un archivo por persona. Git puede
integrar cambios realizados en partes diferentes de un mismo archivo.

Tiempo estimado: 1 minuto.

---
## Del issue a la integración

.center[

### Issue asignado → En progreso → Rama → Commit

### → Pull Request → Revisión → Integración en `main`

]

1. El issue describe el trabajo.
2. La rama mantiene separado el cambio.
3. El commit registra la aportación.
4. El Pull Request propone incorporarla.
5. Otra persona revisa el resultado.
6. `main` reúne las aportaciones aprobadas.


&lt;img src="img/branches-pr.png" width="350px" style="display: block; margin: auto;" /&gt;


???

Presenta el flujo completo antes de los comandos. Deben saber para qué sirve
cada paso antes de ejecutarlo.

Tiempo estimado: 1 minuto.

---
## Convención de trabajo para el curso

&gt; Cada issue que requiera modificar archivos tendrá una rama propia.

El nombre debe incluir:

```text
tipo/numero-actividad (issue)
```

Ejemplos:

```text
docs/12-alcance
docs/13-limitaciones
feature/25-descargar-secuencias
fix/31-validar-fasta
```

No utilicen nombres como:

```text
mi-rama   prueba   cambios   nombre-persona
```

Prefijo: docs/ para documentación, 
feature/ para funcionalidad y fix/ para correcciones  

El número corresponde al issue, sin escribir el símbolo #  

???

En esta práctica se utilizará únicamente el prefijo docs. Más adelante podrán
usar feature para funcionalidad y fix para correcciones. El número corresponde
al issue, sin escribir el símbolo #.

Tiempo estimado: 2 minutos.

---
## Antes de crear una rama

Comprueben siempre:

1. ¿Estoy dentro del repositorio correcto?
2. ¿Tengo cambios pendientes?
3. ¿Estoy en `main`?
4. ¿`main` está actualizada?
5. ¿Cuál es el issue que atenderé?

### Terminal
Localicen su proyecto:
```bash
git status
git switch main
git pull
```

### GitHub Desktop

```text
Current Branch: main → Fetch origin → Pull origin (si aparece)
```


???
&gt; Revisar → actualizar `main` → crear la rama → trabajar


No continúes si git status muestra cambios pendientes. Ayuda al estudiante a
confirmar o guardar esos cambios antes de crear la rama.

Tiempo estimado: 2 minutos.

---
## Crear y comprobar la rama

### Terminal

```bash
git switch -c docs/1-resumen
git branch
git status
```

El asterisco (*) desplegado por  `git branch` indica la rama activa.

### GitHub Desktop

1. Abrir **Current Branch**.
2. Seleccionar **New Branch**.
3. Escribir `docs/1-resumen`.
4. Confirmar **Create Branch**.
5. Verificar el nombre en **Current Branch**.

&gt; Antes de editar, comprueben que ya no están en `main`.

???

Demuestra ambas interfaces, pero no pidas repetir todo en las dos. En cada
equipo, al menos una persona puede usar terminal y otra GitHub Desktop.

Tiempo estimado: 3 minutos.

## EJERCICIO EN EQUIPO

# Completar un mismo reporte mediante tres ramas

Cada integrante:

1. Trabajará en una rama diferente.
2. Editará una sección asignada de `docs/reporte-proyecto.md`.
3. Agregará uno o más párrafos (cambios se que requiran)
4. Publicará su rama.
5. Abrirá un Pull Request.
6. Revisará el cambio de otra persona.
7. Integrará los cambios a `main`.

### Tiempo total: 20 minutos

???

Distribución sugerida: preparación 3 minutos; redacción 4; commit y publicación
4; Pull Requests y revisión 6; integración y comprobación 5.

---
## Comenzamos: Preparación del ejercicio — 3 minutos

Los tres integrantes:

1. Localicen el issue que les corresponde.
2. Muévanlo de **Por hacer** a **En progreso**.
3. Actualicen `main`.
4. Creen la rama desde `main`. **Cada integrante crea una rama diferente**.
5. Comprueben la rama activa antes de editar.

| Sección | Rama sugerida |
|:--|:--|
| Resumen | `docs/NUMERO-resumen` |
| Contexto y antecedendes | `docs/NUMERO-contexto-antecedentes` |
| Justificación | `docs/NUMERO-justificacion` |

&gt; Sustituyan `NUMERO` por el número real del issue.

???

Las tres ramas deben crearse desde main antes de integrar cualquiera. Si
alguien crea su rama mientras está activa otra rama, debe detenerse y pedir
apoyo.

Antes de la clase, agrega estos tres bloques al final del reporte y asegúrate de
que cada equipo tenga tres issues abiertos que correspondan con ellos. Así no
se sobrescriben las secciones elaboradas en la tarea anterior.

---
## Redactar la sección — 4 minutos

```bash
nano docs/reporte-proyecto.md 
```
o bien, abrir directamente el archivo desde el explorador/finder.  

Cada persona puede agregar:

- Uno o más párrafos.
- Una lista.
- Etc.  

Debe modificar **exclusivamente** el contenido de su sección.  


&gt; La cantidad de líneas no causa el conflicto para Git; importa que las personas no modifiquen la misma zona.

---
## Reglas para evitar conflictos en esta práctica

1. Modifiquen solamente la sección asignada.
2. No cambien encabezados, marcadores ni separadores.
3. No reorganicen las secciones.
4. Revisen las diferencias antes del commit.
5. Si aparecen cambios fuera de su sección, no continúen.

&gt; En la vida real, la coordinación del equipo también es parte del trabajo con Git.

???

No enseñes todavía a resolver conflictos. El propósito es que vivan primero una
integración exitosa y comprendan por qué coordinar el trabajo reduce conflictos.

---
## Revisar y confirmar los cambios — 3 minutos

### Terminal

```bash
git status
git diff
git add docs/reporte-proyecto.md
git commit -m "docs: documentar el resumen preliminar del proyecto"
```

### GitHub Desktop

1. Abrir el panel **Changes**.
2. Confirmar que sólo cambió la sección asignada.
3. Escribir un mensaje descriptivo.
4. Seleccionar **Commit to [nombre de la rama]**.

&gt; Aunque la rama contiene el documento completo, el commit registra las líneas modificadas.

???

Muestra una diferencia con líneas eliminadas en rojo y agregadas en verde. Pide
que confirmen que no tocaron otra sección.

---
## Publicar la rama — 1 minuto

### Terminal

```bash
git push -u origin docs/1-resumen  
```
**-u** solo se utiliza la primera vez para publicar la rama, después ya no es necesario.   

Después del primer envío bastará con:

```bash
git push
```

### GitHub Desktop

Seleccionar:

```text
Publish branch
```

&gt; Publicar una rama no modifica automáticamente `main`.

Ahora, localiza la rama en GitHub. ¿Se ven tus cambios en la rama main?  

???

Pide que localicen la rama en GitHub. La opción -u establece la relación entre
la rama local y la rama remota.

---
## El Pull Request propone la integración

Un **Pull Request** permite:

- Comparar la rama con `main`.
- Explicar qué se modificó.
- Solicitar la revisión de otra persona.
- Comentar y corregir antes de integrar.
- Fusionar el cambio cuando esté listo.

.center[
### Publicar una rama ≠ integrarla en `main`
]

???

Introduce sólo lo necesario para completar el ejercicio. Los Pull Requests
podrán estudiarse con mayor profundidad cuando trabajen con código.

---
## Crear el Pull Request — 3 minutos

En GitHub:

1) Aparecerá un mensaje en color amarillo indicando el nombre de tu rama y el tiempo en que se subieron los cambios. Dar clic en el botón verde **Compare &amp; pull request**.  
2)  Verificar que se muestre el mensaje: **Able to merge. These branches can be automatically merged.**  
3) Comprobar cuidadosamente:  

```text
base: main ← compare: rama-del-estudiante
```

4) Escribir un título que describa el cambio.  
5) Explicar brevemente qué sección se modificó.    
OPCIONAL: Vincular el issue en la descripción: Si indicas la palabra Closes seguido del # y número de issue automáticamente se cerrá cuando el PR sea aprobado.  

```markdown
Closes #13
```

---
## Crear el Pull Request — 3 minutos

6) Asigna un responsable: 
- Persona 1 revisa a Persona 2.
- Persona 2 revisa a Persona 3.
- Persona 3 revisa a Persona 1.

7) Seleccionar **Create pull request**.

&gt; Crear el Pull Request no fusiona todavía los cambios.

???

Punto crítico: verifica que la base sea main y compare sea la rama propia. Si
aparecen cambios de otra persona, no deben fusionar.

---
## Revisar antes de integrar — 3 minutos

Cada integrante revisa el Pull Request de otra persona:

- Persona 1 revisa a Persona 2.
- Persona 2 revisa a Persona 3.
- Persona 3 revisa a Persona 1.

En **Files changed**, comprueben:

- ¿Sólo cambió la sección asignada?
- ¿Cumple los criterios del issue?
- ¿Se conservaron encabezados y marcadores?
- ¿El texto es claro y coherente?

Después:

```text
Review changes → Submit review
```

???

Si los permisos no permiten aprobar formalmente, pueden dejar un comentario.
No detengas la práctica por esa configuración.

---
## Integrar las aportaciones — 5 minutos

Regresa a 
Fusionen los Pull Requests **uno por uno**:

1. Integrar la sección 1 y observar `main`.
2. Integrar la sección 2 y volver a observar `main`.
3. Integrar la sección 3 y revisar el reporte completo.

Seleccionen:

```text
Ready to merge → Merge pull request → Confirm merge
```

Después de cada integración, `main` acumula una nueva aportación.

&gt; Git puede combinar automáticamente cambios realizados en zonas diferentes del mismo archivo.

???

Verifica que GitHub indique que puede fusionarse. Tras cada integración, abre
el archivo desde main y muestra cómo se acumulan los cambios.

---
## Finalizar el flujo de trabajo

Después de integrar:

1. Comprobar los criterios de aceptación del issue.
2. Verificar que se cerró mediante `Closes #NUMERO`.
3. Mover el issue a **Terminado** en el Project.
4. Eliminar la rama con **Delete branch** en la sección Branches.
5. Antes del siguiente trabajo, actualizar nuevamente `main`.

.center[
### Issue → rama → Pull Request → revisión → `main` → Terminado
]

???

La eliminación se realiza desde GitHub después de integrar. No enseñes todavía
los comandos para eliminar ramas locales o remotas.

---

## Comprobación del ejercicio

Cada equipo debe tener:

- [ ] Tres issues relacionados con el reporte.
- [ ] Tres ramas creadas desde `main`.
- [ ] Tres cambios en secciones diferentes del mismo archivo.
- [ ] Un commit y una rama publicada por integrante.
- [ ] Tres Pull Requests comparados contra `main`.
- [ ] Una revisión realizada por cada integrante.
- [ ] Las tres aportaciones integradas en `main`.
- [ ] Los issues cerrados y en estado **Terminado**.

### Pregunta final

&gt; ¿Qué permitió que Git integrara las tres contribuciones sin reemplazar el trabajo de otra persona?

???

Respuesta esperada: cada persona trabajó en una rama y modificó una zona
diferente, claramente delimitada, del mismo archivo.

Tiempo estimado: 2 minutos.

---
## Conclusiones

- Los issues indican qué debe hacerse.
- GitHub Projects muestra cómo avanza el trabajo.
- Las ramas separan temporalmente las contribuciones.
- Los commits registran los cambios de cada persona.
- Los Pull Requests permiten revisar e integrar.
- `main` reúne las aportaciones aprobadas.

.center[
### Las ramas permiten trabajar en paralelo sin modificar directamente la versión principal.
]

???

Regresa al archivo final en main y señala las tres contribuciones.

Tiempo estimado: 1 minuto.

# Etiquetas o tags de Git

## MATERIAL COMPLEMENTARIO 


## Eliminando de ramas

Para ello utilizaremos el comando __git branch__, pero agregaremos la opción __-d__ para indicar que es esa rama la que queremos eliminar.

Sintaxis:  

.full-width[.content-box-yellow[git branch -d [branch_name]]]

Ejemplo:  

.full-width[.content-box-yellow[$ git branch -d docs/1-resumen]]

IMPORTANTE: Parar borrar la rama debemos estar fuera de ella. Puede que esta acción no nos funcione porque hayamos hecho cambios que no se hayan salvado en el repositorio remoto, o no se hayan fusionado con otras ramas. Para forzar el borrado utilizaríamos la opción __-D__

---

## Eliminando ramas remotas

Si la rama que queremos eliminar está en el repositorio remoto tendremos que hacer un push indicando la opción --delete, seguida del nombre de la rama que se deseamos borrar.


Sintaxis:  

.full-width[.content-box-yellow[git push origin --delete [branch_name]]]

Ejemplo:  

.full-width[.content-box-yellow[$ git push origin --delete docs/1-resumen]]


---

## Descargando una rama del repositorio remoto

A veces ocurre que se generan ramas en el repositorio remoto, por ejemplo, cuando han sido creadas por otros usuarios y subidas a GitHub, y necesitaremos acceder a ellas en el repositorio local para verificar los cambios o continuar el trabajo. En principio, esas ramas creadas por otros usuarios no están disponibles para nosotros en local, pero las podemos descargar.

Sintaxis:  

.full-width[.content-box-yellow[git fetch]]
